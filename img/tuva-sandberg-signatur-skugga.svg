<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 95 1570 420" role="img" aria-labelledby="title desc">
  <title id="title">Tuva Sandberg</title>
  <desc id="desc">Vinröd kalligrafisk signatur med mjuka kopior ovanför och under som skuggeffekt.</desc>
  <defs>
    <filter id="soft-shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="2.5" />
    </filter>
  </defs>
  <style>
    .ink { fill: #800525; stroke: #800525; stroke-width: 3; stroke-linejoin: round; paint-order: stroke fill; }
    .script { font-family: 'Snell Roundhand', 'Apple Chancery', cursive; font-style: italic; font-weight: 600; }
  </style>
  <g class="script" fill="#800525" aria-hidden="true" opacity="0.11" filter="url(#soft-shadow)" transform="translate(0,18)">
    <text x="72" y="366" font-size="350">T</text>
    <text x="370" y="275" font-size="222" letter-spacing="-7">uva</text>
    <text x="620" y="366" font-size="350">S</text>
    <text x="860" y="275" font-size="222" letter-spacing="-8">andberg</text>
  </g>
  <g class="script" fill="#800525" aria-hidden="true" opacity="0.11" filter="url(#soft-shadow)" transform="translate(0,102)">
    <text x="72" y="366" font-size="350">T</text>
    <text x="370" y="275" font-size="222" letter-spacing="-7">uva</text>
    <text x="620" y="366" font-size="350">S</text>
    <text x="860" y="275" font-size="222" letter-spacing="-8">andberg</text>
  </g>
  <g class="ink script" transform="translate(0,60)">
    <text x="72" y="366" font-size="350">T</text>
    <text x="370" y="275" font-size="222" letter-spacing="-7">uva</text>
    <text x="620" y="366" font-size="350">S</text>
    <text x="860" y="275" font-size="222" letter-spacing="-8">andberg</text>
  </g>
</svg>
